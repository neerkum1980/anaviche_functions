name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "fe/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

# Deploys fe/ to the test Static Web App. Production (anaviche.ch) is a storage static
# website; deploy it with fe/scripts/deploy-prod.sh.
concurrency:
  group: deploy-frontend-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # The test site runs without login.
          VITE_AUTH_DISABLED: true

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_TOKEN_TEST }}
          action: upload
          app_location: fe/dist
          skip_app_build: true
