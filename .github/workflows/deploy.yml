# Deploys the Function App code.
#   push to main          -> anaviche-functions-test-y1 (test), automatically
#   Run workflow (manual) -> anaviche-functions (production) by default, from main only
#
# Azure login uses OIDC through the Entra app "anaviche-functions-github-deploy". Its
# federated credentials trust this repo's "test" and "production" environments, and it
# has Website Contributor on the two Function Apps only. No secrets are stored in GitHub.

name: Deploy Functions

on:
  push:
    branches: [main]
    paths-ignore:
      - ".claude/**"
      - ".mcp.json"
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to deploy to"
        type: choice
        options: [production, test]
        default: production

permissions:
  id-token: write   # OIDC login to Azure
  contents: read

env:
  AZURE_CLIENT_ID: d6af7cfa-a2f0-41ca-b115-d0ad15fb0b32
  AZURE_TENANT_ID: 9636baf2-1763-480c-8bb3-5689803dbf04
  AZURE_SUBSCRIPTION_ID: d00d160d-520b-4380-aae9-4930c151b7eb
  PYTHON_VERSION: "3.12"   # matches the Function Apps' runtime (Python|3.12)

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile and import every function
        run: |
          for d in */; do
            if [ -f "$d/function.json" ]; then
              python -m py_compile "$d/__init__.py"
              python -c "import importlib; importlib.import_module('${d%/}')"
              echo "ok: ${d%/}"
            fi
          done

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'test' || inputs.target }}
    concurrency:
      group: deploy-${{ github.event_name == 'push' && 'test' || inputs.target }}
      cancel-in-progress: false
    steps:
      - name: Resolve target
        id: target
        run: |
          target="${{ github.event_name == 'push' && 'test' || inputs.target }}"
          if [ "$target" = "production" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production deploys must run from main (got $GITHUB_REF)."
            exit 1
          fi
          if [ "$target" = "production" ]; then
            echo "app=anaviche-functions" >> "$GITHUB_OUTPUT"
            echo "rg=AnavicheRG" >> "$GITHUB_OUTPUT"
          else
            echo "app=anaviche-functions-test-y1" >> "$GITHUB_OUTPUT"
            echo "rg=AnavicheRG-test" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7

      # With OIDC (no publish profile) the action deploys via WEBSITE_RUN_FROM_PACKAGE,
      # which skips the remote Oryx build, so dependencies must ship inside the zip.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies into the package
        run: pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to ${{ steps.target.outputs.app }}
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.target.outputs.app }}
          package: .
          respect-funcignore: true
          scm-do-build-during-deployment: false
          enable-oryx-build: false

      # One read-only request per function. Any import error makes a function return 500,
      # so a function that answers with its own expected status has loaded correctly.
      - name: Smoke test (every function, read-only)
        run: |
          app="${{ steps.target.outputs.app }}"; rg="${{ steps.target.outputs.rg }}"
          key=$(az functionapp keys list -n "$app" -g "$rg" --query functionKeys.default -o tsv)
          echo "::add-mask::$key"
          host=$(az functionapp show -n "$app" -g "$rg" --query defaultHostName -o tsv)

          # function | path | send key? | expected status | text the body must contain
          checks='PropertiesAPI|properties|key|200|
          ExpenseApi|expenses?propertyId=__smoke__|key|200|
          DocumentManagement|DocumentManagement?propertyId=__smoke__|key|200|
          BillsDownloadApi|BillsDownloadApi|key|400|documentId
          gateway|gateway/properties|nokey|200|'

          run_checks() {
            failed=0
            while IFS='|' read -r name path auth want text; do
              name=$(echo "$name" | xargs)
              headers=()
              [ "$auth" = "key" ] && headers=(-H "x-functions-key: $key")
              code=$(curl -s -o body.txt -w "%{http_code}" --max-time 60 "${headers[@]}" "https://$host/api/$path" || echo "000")
              if [ "$code" = "$want" ] && { [ -z "$text" ] || grep -q "$text" body.txt; }; then
                printf "  ok    %-20s %s\n" "$name" "$code"
              else
                printf "  FAIL  %-20s got %s, want %s\n" "$name" "$code" "$want"
                failed=1
              fi
            done <<< "$checks"

            # McpServer speaks JSON-RPC over POST; tools/list must return the tool set.
            code=$(curl -s -o body.txt -w "%{http_code}" --max-time 60 -X POST "https://$host/api/mcp" \
              -H "x-functions-key: $key" -H "Content-Type: application/json" \
              -H "Accept: application/json, text/event-stream" \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' || echo "000")
            if [ "$code" = "200" ] && grep -q '"list_properties"' body.txt; then
              printf "  ok    %-20s %s\n" "McpServer" "$code"
            else
              printf "  FAIL  %-20s got %s, want 200 with tools\n" "McpServer" "$code"
              failed=1
            fi
            return $failed
          }

          for i in $(seq 1 10); do
            echo "Attempt $i on $host"
            if run_checks; then echo "All functions passed."; exit 0; fi
            sleep 15
          done
          echo "::error::Smoke test failed on $host after 10 attempts"; exit 1
