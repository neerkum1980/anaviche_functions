# Deploys the Function App code to the shared test app, anaviche-functions-test-y1.
#   push to main          -> test, automatically
#   Run workflow (manual) -> test again, for a redeploy
# Client stacks (production) are released with release.yml.
#
# Azure login uses OIDC through the Entra app "anaviche-functions-github-deploy". Its
# federated credentials trust this repo's "test" and "production" environments.
# No secrets are stored in GitHub.

name: Deploy Functions

on:
  push:
    branches: [main]
    paths-ignore:
      - ".claude/**"
      - ".mcp.json"
      - "**/*.md"
      - "docs/**"
      - "fe/**"
      - "infra/**"
      - "clients/**"
      - ".github/workflows/deploy-frontend.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/provision-clients.yml"
  workflow_dispatch:

permissions:
  id-token: write   # OIDC login to Azure
  contents: read

env:
  AZURE_CLIENT_ID: d6af7cfa-a2f0-41ca-b115-d0ad15fb0b32
  AZURE_TENANT_ID: 9636baf2-1763-480c-8bb3-5689803dbf04
  AZURE_SUBSCRIPTION_ID: d00d160d-520b-4380-aae9-4930c151b7eb
  PYTHON_VERSION: "3.12"   # matches the Function Apps' runtime
  TEST_APP: anaviche-functions-test-y1
  TEST_RG: AnavicheRG-test

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile and import every function
        run: |
          for d in */; do
            if [ -f "$d/function.json" ]; then
              python -m py_compile "$d/__init__.py"
              python -c "import importlib; importlib.import_module('${d%/}')"
              echo "ok: ${d%/}"
            fi
          done

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: test
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # With OIDC (no publish profile) the action deploys via WEBSITE_RUN_FROM_PACKAGE,
      # which skips the remote Oryx build, so dependencies must ship inside the zip.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # functions-action deletes .funcignore'd files from the folder it packages, so the
      # package is staged in a copy; the checkout keeps .github/scripts and fe/.
      - name: Stage the package with its dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          rsync -a --exclude .git --exclude fe ./ "$RUNNER_TEMP/package/"
          pip install -r requirements.txt --target="$RUNNER_TEMP/package/.python_packages/lib/site-packages"

      - uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to ${{ env.TEST_APP }}
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.TEST_APP }}
          package: ${{ runner.temp }}/package
          respect-funcignore: true
          scm-do-build-during-deployment: false
          enable-oryx-build: false

      # The test app has no sign-in, so gateway answers anonymous calls with 200.
      - name: Smoke test (every function, read-only)
        run: .github/scripts/smoke-test.sh "$TEST_APP" "$TEST_RG" 200
